name: Release

# Tag a release to publish it:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Produces tarballs for Linux and macOS, a zip and an installer for Windows,
# and a checksums file covering all of them. The release is left as a DRAFT so
# the notes can be reviewed before anyone can download it.
on:
  push:
    tags: ["v*"]
  # Lets the whole pipeline be exercised without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything except the Windows installer. gpsync has no cgo, so the Windows
  # binaries cross-compile here too and the installer job only has to package
  # them.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` needs tags for the version stamp
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # GITHUB_REF_NAME is the TAG only for a tag push; on workflow_dispatch
      # it is the branch name. `numeric` drops any pre-release suffix because
      # Inno Setup's VersionInfoVersion must be numeric.
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          n=$(printf '%s' "$v" | sed -E 's/[^0-9.].*$//; s/\.$//; s/^$/0.0.0/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$n" >> "$GITHUB_OUTPUT"

      - run: make dist-all VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Inno Setup ships on GitHub's Windows images, so this only needs the
  # already-built binaries.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          n=$(printf '%s' "$v" | sed -E 's/[^0-9.].*$//; s/\.$//; s/^$/0.0.0/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$n" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $n = "${{ steps.version.outputs.numeric }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$v" `
            "/DNumericVersion=$n" `
            "/O.\dist" `
            ".\packaging\gpsync.iss"

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/gpsync-setup-*.exe
          retention-days: 7

  release:
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      # The build job wrote checksums for the archives; the installer did not
      # exist yet at that point, so regenerate over everything published.
      #
      # The asset list is explicit rather than a `gpsync-*` glob: dist/ also
      # holds the raw gpsync-tray.exe that the zip is built from, which that
      # glob matched, so shipped checksums files listed a file that was never
      # a release asset.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          rm -f checksums.txt
          ls -1 gpsync-*.tar.gz gpsync-*.zip gpsync-setup-*.exe > assets.txt
          echo "Publishing these assets:"
          cat assets.txt
          sha256sum $(cat assets.txt) > checksums.txt
          cat checksums.txt

      # Published with the gh CLI rather than a third-party action, matching
      # ci.yml's own reasoning for installing golangci-lint directly: fewer
      # moving parts in a workflow that holds contents:write.
      #
      # The action this replaces logged every asset as uploaded and then
      # failed while finalising, leaving a DIFFERENT partial set behind on
      # each attempt -- a half-populated draft that looked plausible. Create
      # and upload are separate steps here, and the verify step below is what
      # makes a partial upload fail loudly instead of shipping quietly.
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          mapfile -t assets < <(cat assets.txt)
          assets+=(checksums.txt)

          # Idempotent: a re-run after a partial failure reuses the draft
          # rather than colliding with it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi

          # --clobber so a retry replaces a half-uploaded asset instead of
          # erroring on the name already being taken.
          for a in "${assets[@]}"; do
            echo "Uploading $a"
            gh release upload "$TAG" "$a" --clobber
          done

      # The whole point of this job: the release either carries every asset
      # or the run fails. A missing or zero-byte asset is caught here rather
      # than by someone downloading it later.
      - name: Verify the published asset set
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          mapfile -t expected < <(cat assets.txt)
          expected+=(checksums.txt)

          # A draft is not visible via releases/tags/<tag>, only in the list.
          gh api --paginate repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | \"\(.name) \(.size) \(.state)\"" > published.txt
          echo "Published:"; cat published.txt

          rc=0
          for a in "${expected[@]}"; do
            line=$(grep -F -- "$a " published.txt || true)
            if [ -z "$line" ]; then
              echo "::error::asset missing from the release: $a"; rc=1; continue
            fi
            size=$(printf '%s' "$line" | awk '{print $2}')
            state=$(printf '%s' "$line" | awk '{print $3}')
            if [ "$state" != "uploaded" ]; then
              echo "::error::asset $a is in state '$state', not 'uploaded'"; rc=1
            fi
            if [ "${size:-0}" -le 0 ]; then
              echo "::error::asset $a published with size $size"; rc=1
            fi
          done

          extra=$(awk '{print $1}' published.txt | grep -vxF -f <(printf '%s\n' "${expected[@]}") || true)
          if [ -n "$extra" ]; then
            echo "::error::unexpected assets on the release:"; printf '%s\n' "$extra"; rc=1
          fi

          [ "$rc" -eq 0 ] || { echo "::error::the release asset set is incomplete -- see above"; exit 1; }
          echo "All ${#expected[@]} assets present, non-empty, and uploaded."
