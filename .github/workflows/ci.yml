name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly full-Windows run below. Also manual, so it can be exercised
  # without waiting a day.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # A matrix cancels its siblings on the first failure by default, which
      # is exactly wrong for a cross-platform suite: a Windows failure kills
      # the ubuntu/macOS jobs before they report, so "Windows-only" and
      # "broken everywhere" look identical and each fix costs an extra run to
      # tell apart. It also silently discards the output of a job added to
      # print diagnostics from a failing platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Defender scans every file the toolchain and the tests write, and a Go
      # test suite writes a great many small ones: each test opens a fresh
      # SQLite database in its own t.TempDir. That overhead is most of why
      # this job runs 8-10m against ~1m15s on ubuntu -- internal/statedb alone
      # was 349s against 8s on Linux, 44x, with no large files and no sleeps in
      # the package at all. Excluding the paths involved costs nothing
      # here: the runner is ephemeral and is destroyed after the job, so this
      # is not the same trade-off as disabling it on a real machine.
      #
      # Best-effort on purpose. Add-MpPreference needs elevation and Defender
      # may be absent or already managed by policy on a future image; a
      # failure here should slow the job down, not fail it.
      - name: Exclude the build and test paths from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE), (go env GOMODCACHE))) {
            if ($p) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          }
          Add-MpPreference -ExclusionProcess 'go.exe' -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'compile.exe' -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'link.exe' -ErrorAction SilentlyContinue

      - run: go build ./...
      - run: go vet ./...

      # 30m, not go test's 10m default: the Windows runner is slow and wildly
      # variable (the same commit has taken 7m19s and 25m41s), so a budget
      # close to the typical cost fails runs that changed no code at all.
      - name: Test
        if: runner.os != 'Windows'
        run: go test ./... -count=1 -timeout 30m

      # Windows is 8-25m against ~1m on Linux, and most of that is spent on
      # packages whose behaviour cannot differ by OS: engine, uploader and
      # statedb were 859s between them, and contain ZERO files with a
      # windows/!windows build tag or a runtime.GOOS check. They are Go over
      # SQLite and HTTP. Skipping them here is the same argument the race job
      # already makes for being Linux-only.
      #
      # This is a DENYLIST on purpose. An allowlist would silently drop a new
      # package off the Windows path the day it was added; with a denylist,
      # anything new is covered on Windows until someone deliberately excludes
      # it.
      #
      # These three are not abandoned: the full suite still runs on Windows
      # nightly (windows-full below) and, blocking, before any release
      # publishes (release.yml). The coverage moved off the PR path, it did
      # not go away. statedb is the one that gives most pause -- SQLite file
      # locking genuinely is OS-specific even with no build tags in the
      # package -- which is exactly why the release gate blocks rather than
      # merely warns.
      - name: Test (OS-sensitive packages only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -vE '/internal/(engine|uploader|statedb)$')
          echo "Running on Windows:"; echo "$pkgs" | sed 's/^/  /'
          go test $pkgs -count=1 -timeout 30m

  # The Windows half of the PR-path bargain. The test job above skips engine,
  # uploader and statedb on Windows so a pull request is not waiting 8-25m on
  # packages that have no OS-specific code; this runs the whole suite there,
  # nightly, so a Windows-only regression in one of them surfaces within a day
  # instead of at release time. release.yml runs the same thing as a blocking
  # gate before anything publishes.
  #
  # 45m, not 30m: this is the full suite on the slowest runner, and a bad
  # night has already taken 25m41s.
  windows-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go test ./... -count=1 -timeout 45m

  # The upload pipeline is concurrent throughout: a circuit breaker and an
  # adaptive limiter shared across goroutines, plus the watch loop. Two real
  # races have shipped here before, both of the kind only this catches.
  # Linux only -- the detector is slow, and races are not OS-specific.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # The race detector makes everything several times slower again, so
      # this needs more headroom than the plain run, not less.
      - run: go test -race ./... -count=1 -timeout 45m

  # gpsync-tray is Windows-only, so it never builds on the Linux job above.
  # This also proves every release target still cross-compiles.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: make dist-all VERSION=ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # No action here on purpose. .golangci.yml is v2, and golangci-lint v2
      # is published at a NEW module path (/v2/...) that the action's older
      # majors cannot resolve. Installing it directly removes a third-party
      # action from a workflow that reads the whole repo, and pins the exact
      # version a developer runs locally.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
