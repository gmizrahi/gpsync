name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  # The upload pipeline is concurrent throughout: a circuit breaker and an
  # adaptive limiter shared across goroutines, plus the watch loop. Two real
  # races have shipped here before, both of the kind only this catches.
  # Linux only -- the detector is slow, and races are not OS-specific.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test -race ./... -count=1

  # gpsync-tray is Windows-only, so it never builds on the Linux job above.
  # This also proves every release target still cross-compiles.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make dist-all VERSION=ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # The action's own default installs golangci-lint v1, which refuses a
      # v2 config AND cannot target go1.26 ("the Go language version (go1.24)
      # used to build golangci-lint is lower than the targeted Go version").
      # This repo's .golangci.yml is v2, so the major is pinned explicitly
      # rather than left to the action's default.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.6.0
          install-mode: goinstall

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
