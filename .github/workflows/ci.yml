name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # windows-latest is temporarily absent: the suite has 12 failures
        # there, traced to one root cause (path-separator handling in the
        # ledger's LIKE patterns) plus test-side POSIX assumptions. Tracked
        # in the issue linked from the README's Contributing section; the
        # Windows binaries are still built and vetted by cross-build below.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  # The upload pipeline is concurrent throughout: a circuit breaker and an
  # adaptive limiter shared across goroutines, plus the watch loop. Two real
  # races have shipped here before, both of the kind only this catches.
  # Linux only -- the detector is slow, and races are not OS-specific.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go test -race ./... -count=1

  # gpsync-tray is Windows-only, so it never builds on the Linux job above.
  # This also proves every release target still cross-compiles.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: make dist-all VERSION=ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # No action here on purpose. .golangci.yml is v2, and golangci-lint v2
      # is published at a NEW module path (/v2/...) that the action's older
      # majors cannot resolve. Installing it directly removes a third-party
      # action from a workflow that reads the whole repo, and pins the exact
      # version a developer runs locally.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
